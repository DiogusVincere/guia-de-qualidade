name: conferir

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Conferir o guia (itens, ids, links, manifestos, skills)
        run: python ferramentas/conferir.py

      - name: Instalar dependência do scanner
        run: pip install -r testes-ativos/requirements.txt

      - name: Testar o scanner contra um site de mentira vulnerável (offline)
        run: python -m unittest testes-ativos/teste_scanner.py -v

      - name: Testar as camadas novas — OAST, descoberta, navegador (offline; pula o que falta)
        run: python -m unittest testes-ativos/teste_moderno.py -v

      - name: Testar as sondas de IA e cadeia — MCP, injeção de prompt, slopsquatting (offline)
        run: python -m unittest testes-ativos/teste_ia.py -v

      - name: Testar a interface local (offline)
        run: python -m unittest interface/teste_interface.py -v

      - name: Nenhum termo proibido (empresa, cliente, pessoa real, dado pessoal)
        env:
          # lista do escritório e dos clientes, separada por vírgula; fica em Settings > Secrets, nunca no código
          TERMOS_PROIBIDOS: ${{ secrets.TERMOS_PROIBIDOS }}
        run: python ferramentas/conferir.py --termos
